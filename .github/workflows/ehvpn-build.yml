name: Build Ehvpn V0.9
on:
  push:
    branches: [ main ]
    paths:
      - 'Ehvpn_V0.9_FullscreenVideo_Project.zip.part*'
      - '.github/workflows/ehvpn-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble project archive
        run: |
          cat Ehvpn_V0.9_FullscreenVideo_Project.zip.part* > /tmp/ehvpn-project.zip
          unzip -t /tmp/ehvpn-project.zip
          unzip -q /tmp/ehvpn-project.zip -d /tmp/ehvpn-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: /tmp/ehvpn-src/ehvpn_v0_9_project
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Ehvpn-V0.9-fullscreen-video-debug-apk
          path: /tmp/ehvpn-src/ehvpn_v0_9_project/app/build/outputs/apk/debug/*.apk
          retention-days: 14
